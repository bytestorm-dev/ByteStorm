org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Projektversion für alle Subprojekte (§22). Endet sie auf SNAPSHOT, veröffentlicht
# die GitHub-Action einen Beta-Release, sonst einen öffentlichen Release. Der
# Release-Workflow läuft nur auf Tags v<version> und prüft den Gleichstand.
version=1.2.3

# JDK 26 für die Toolchain automatisch beschaffen (Erststart lädt ~200 MB nach ~/.gradle/jdks).
org.gradle.java.installations.auto-download=true
