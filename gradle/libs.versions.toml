[versions]
# Toolchain — see ByteStorm-Konzept.md §1
jvm = "26"

# Serialisierung (§6)
protobuf = "4.36.2"
protobufPlugin = "0.10.0"

# Persistenz / Messaging (§7, §8)
redisson = "4.8.0"
mongodb = "5.13.0"
en2do = "3.3.3"

# Config (§21)
jackson = "2.22.4"

# Infrastruktur
lombok = "1.18.48"
slf4j = "2.0.20"
logback = "1.6.5"
jline = "4.4.8"

# Tests
junit = "6.1.3"

# Build
shadow = "9.6.1"

# Optionale Module (§18, §19) + Docker (§12.3)
javalin = "7.2.3"
jda = "6.7.0"
dockerJava = "3.7.1"

# Plattformen (§13) — PaperMC-Repository, siehe Root-Build
paperApi = "26.3.build.214-stable"
velocityApi = "4.3.0"
bungeeApi = "1.21-R0.4"

[libraries]
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }

redisson = { module = "org.redisson:redisson", version.ref = "redisson" }
mongodb-driver-sync = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb" }
en2do = { module = "eu.koboo:en2do", version.ref = "en2do" }

lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-jdk14 = { module = "org.slf4j:slf4j-jdk14", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
jline = { module = "org.jline:jline", version.ref = "jline" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

javalin = { module = "io.javalin:javalin", version.ref = "javalin" }
jda = { module = "net.dv8tion:JDA", version.ref = "jda" }
docker-java = { module = "com.github.docker-java:docker-java", version.ref = "dockerJava" }

paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paperApi" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocityApi" }
bungeecord-api = { module = "net.md-5:bungeecord-api", version.ref = "bungeeApi" }

[plugins]
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
